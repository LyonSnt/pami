services:
  web:
    entrypoint: []
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    ports:
      - "${WEB_PORT}:8000"

  db:
    ports:
      - "${DB_PUBLIC_PORT}:5432"

  tailwind:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - pami_node_modules:/app/node_modules
    command: sh -c "npm install && npm run tailwind:watch"
    networks:
      - pami_network

volumes:
  pami_node_modules:
