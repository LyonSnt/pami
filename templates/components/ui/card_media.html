{% load static %}
<div class="flex w-full items-center justify-center overflow-hidden bg-slate-100{% if wide %} aspect-video{% else %} aspect-4/3{% endif %}">
  {% if image %}
    <img
      src="{{ image.url }}"
      alt="{{ alt }}"
      width="{{ image.width }}"
      height="{{ image.height }}"
      {% if eager %}fetchpriority="high"{% else %}loading="lazy"{% endif %}
      decoding="async"
      class="h-full w-full object-cover"
    >
  {% else %}
    <img
      src="{% static 'assets/branding/icon.svg' %}"
      alt=""
      width="44"
      height="44"
      aria-hidden="true"
      class="h-12 w-12"
    >
  {% endif %}
</div>
