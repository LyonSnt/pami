{% if messages %}
  <div
    aria-live="polite"
    aria-atomic="true"
    class="mx-auto max-w-7xl px-4 pt-4 sm:px-6 lg:px-8"
  >
    {% for message in messages %}
      <div role="status" class="rounded-lg border border-slate-200 bg-white p-4 text-sm text-slate-700 shadow-sm{% if not forloop.first %} mt-2{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
