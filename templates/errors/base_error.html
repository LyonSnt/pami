{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Error{% endblock %} | Pámi</title>
  <link rel="icon" href="{% static 'assets/branding/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-900">
  <main class="mx-auto flex min-h-screen max-w-3xl items-center px-4 py-12 sm:px-6 lg:px-8">
    <section class="w-full rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm sm:p-12" aria-labelledby="error-title">
      <img
        src="{% static 'assets/branding/logo.svg' %}"
        alt="Pámi"
        width="160"
        height="52"
        class="mx-auto h-auto w-40"
      >
      <p class="mt-8 text-sm font-semibold uppercase tracking-wide text-primary">
        {% block error_code %}{% endblock %}
      </p>
      <h1 id="error-title" class="mt-3 text-3xl font-bold tracking-tight sm:text-4xl">
        {% block heading %}{% endblock %}
      </h1>
      <p class="mx-auto mt-4 max-w-xl text-base leading-7 text-slate-600 sm:text-lg">
        {% block description %}{% endblock %}
      </p>
      <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
        {% block actions %}{% endblock %}
      </div>
    </section>
  </main>
</body>
</html>
