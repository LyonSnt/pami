services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - pami_static:/app/staticfiles
      - pami_media:/app/media
    expose:
      - "8000"
    networks:
      - pami_network

  db:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pami_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    expose:
      - "5432"
    networks:
      - pami_network

volumes:
  pami_postgres_data:
  pami_static:
  pami_media:

networks:
  pami_network:
    driver: bridge
